<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELADERIA DOÑA NIEVE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HELADERIA DOÑA NIEVE</h1>
        <p>
            En la Heladeria Doña Nieve tenemos deliciosos helados para disfrutar
            en cualquier momento del dia y sobre todo en dias calurosos.
        </p>
    </header>
    <main>
        <form id="form-helados" novalidate method="POST" action="procesar.php">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>
            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" name="correo" required>
            <br><br>
            <label for="sabores">Que sabores queres</label>
            <textarea id="sabores" name="sabores"></textarea>
            <br><br>
            <button type="submit">Enviar mi pedido</button>
            <p id="aviso-helados" class="aviso"></p>
        </form>
    </main>
    <footer>
        Parcial 2 - Joel Marcos Canaviri Vargas - 11 de agosto de 2026
    </footer>
    <script src="script.js"></script>
</body>
</html>
